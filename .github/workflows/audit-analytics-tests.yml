name: Audit analytics tests
on:
  push:
    paths:
      - "agentic-ai-lab/analytics/**"
      - "agentic-ai-lab/worker/src/**"
      - "agentic-ai-lab/index.html"
      - ".github/workflows/audit-analytics-tests.yml"
  pull_request:
    paths:
      - "agentic-ai-lab/analytics/**"
      - ".github/workflows/audit-analytics-tests.yml"
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check agentic-ai-lab/worker/src/index.js
      - name: Check portfolio page JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("agentic-ai-lab/index.html").read_text()
          scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script\\s*>", page, re.IGNORECASE)
          if not scripts:
              raise SystemExit("No script blocks found in agentic-ai-lab/index.html")
          out = Path("/tmp/audit-page-scripts")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f"script-{index:02d}.js").write_text(script)
          print(f"Extracted {len(scripts)} script blocks for syntax validation")
          PY
          for script in /tmp/audit-page-scripts/*.js; do
            echo "Checking $script"
            node --check "$script"
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r agentic-ai-lab/analytics/python/requirements.txt
      - name: Run analytics unit tests
        run: python -m unittest discover -s agentic-ai-lab/analytics/python -p "test_*.py" -v
      - name: Run analytics against synthetic sample data
        run: python agentic-ai-lab/analytics/python/audit_analytics.py --data-dir agentic-ai-lab/analytics/python/sample_data
