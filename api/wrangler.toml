name = "chintan-travel-api"
main = "worker.js"
compatibility_date = "2026-10-27"

[vars]
ALLOWED_ORIGINS = "https://sanchin007.github.io,http://localhost:8787,http://127.0.0.1:8787"
DEMO_WRITE_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "chintan-travel-demo"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 * * * *"]
