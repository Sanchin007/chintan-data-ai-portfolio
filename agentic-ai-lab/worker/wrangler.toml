name = "airbus-ai-audit-agent"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true

[vars]
GEMINI_MODEL = "gemini-3.8-flash"

# Provision this Rate Limiting binding in the target Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
